<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafaf7" />
    <title>连接电脑 · Scrylet</title>
    <link rel="icon" type="image/png" href="/snap/assets/brand/icon.png" />
    <link rel="apple-touch-icon" href="/snap/assets/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="/snap/assets/pages.css" />
    <script src="/snap/assets/appearance.js"></script>
    <script defer src="/snap/assets/pair.js"></script>
  </head>
  <body>
    <main class="pair-page">
      <a class="brand" href="/"><span class="mark" aria-hidden="true"><img src="/snap/assets/brand/icon.png" alt="" width="28" height="28" /></span> Scrylet</a>
      <div class="pair-visual" aria-hidden="true">
        <div class="computer">
          <div class="screen">
            <span></span><span></span><span></span><i></i>
          </div>
          <b></b>
        </div>
        <div class="connection-line">•••</div>
        <div class="phone"><i>✓</i><span></span><span></span></div>
      </div>
      <div class="page-intro"><span class="eyebrow">电脑截屏 · 手机解答</span><h1>连接你的电脑</h1><p class="section-note">输入连接码，让问题和答案随手可达。</p></div>
      <form id="pair-form">
        <label for="credential">电脑 App 上的 6 位连接码</label
        ><input
          id="credential"
          name="credential"
          inputmode="numeric"
          enterkeyhint="go"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="000000"
          required
          pattern="[0-9]{6}"
          aria-describedby="pair-error pair-help"
        /><button class="primary" id="connect" type="submit">
          连接电脑
        </button>
      </form>
      <p id="pair-error" role="status" aria-live="polite"></p>
      <p id="pair-help" class="footnote">
        手机与电脑需要连接同一 Wi-Fi。<br />配对后可访问这台电脑的聊天记录。模型 API 请在电脑 App 中设置。
      </p>
      <footer>Scrylet <span>·</span> 你的桌面 AI 搭档</footer>
    </main>
  </body>
</html>
