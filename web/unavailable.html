<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf7" />
    <title>等待电脑 · Scrylet</title>
    <link rel="icon" type="image/svg+xml" href="/snap/assets/brand/icon.svg" />
    <link rel="apple-touch-icon" href="/snap/assets/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="/snap/assets/pages.css" />

  </head>
  <body>
    <main class="settings-page connection-page">
      <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5c.7 5.8 3.7 8.8 9.5 9.5-5.8.7-8.8 3.7-9.5 9.5-.7-5.8-3.7-8.8-9.5-9.5 5.8-.7 8.8-3.7 9.5-9.5Z"/></svg></span> Scrylet</div>

      <div class="connection-indicator" aria-hidden="true"><span></span>连接状态</div>

      <p id="connection-help" class="section-note">正在检查电脑 App 的状态…</p>
      <button id="connection-retry" class="primary" type="button">重新检查</button>
      <footer>Scrylet <span>·</span> 你的桌面 AI 搭档</footer>
