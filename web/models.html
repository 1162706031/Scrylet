<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f7fb" />
    <title>模型服务 · Scrylet</title>
    <link rel="icon" type="image/svg+xml" href="/snap/assets/brand/icon.svg" />
    <link rel="apple-touch-icon" href="/snap/assets/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="/snap/assets/pages.css" />
    <script defer src="/snap/assets/models.js"></script>
  </head>
  <body>
    <main class="settings-page">
      <nav class="page-nav" aria-label="页面导航"><a class="back" href="/"><span aria-hidden="true">‹</span>返回对话</a><span class="nav-caption">偏好设置</span></nav>
      <header class="page-intro"><span class="intro-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7L12 3Z"/></svg></span><h1>选择你的 AI 搭档</h1><p class="section-note">连接常用的模型服务，开始解答。</p></header>
      <div class="list-heading"><h2>模型服务</h2><span>使用自己的 API Key</span></div>
      <div id="providers" class="provider-grid"></div>
      <p id="message" class="message" role="status" aria-live="polite">
        正在读取…
      </p>
      <details class="settings-info">
        <summary>数据与模型说明</summary>
        <p>
          密钥和聊天记录保存在电脑。发送问题时，所选图片与文字会传给模型服务。
        </p>
        <p id="verified"></p>
        <p>具体可用型号取决于账户权限。保存密钥不会自动调用模型。</p>
      </details>
      <footer>Scrylet <span>＋</span> Open WebUI</footer>
    </main>
    <dialog id="provider-dialog" aria-labelledby="provider-name" aria-describedby="provider-description">
      <div class="sheet-head">
        <button id="close-provider" type="button" aria-label="关闭模型设置">
          取消
        </button>
      </div>
      <form id="provider-form" class="credentials">
        <h2 id="provider-name" tabindex="-1"></h2>
        <p id="provider-description">添加密钥后，可在对话中选择这家的模型。</p>
        <label for="api-key">API Key</label
        ><input
          id="api-key"
          type="password"
          autocomplete="new-password"
          spellcheck="false"
          placeholder="粘贴你的 API Key"
        />
        <p id="key-note"></p>
        <details>
          <summary>模型与服务地址</summary>
          <div id="model-list" class="model-list"></div>
          <label for="base-url">API 基础地址</label
          ><input id="base-url" type="url" spellcheck="false" required />
        </details>
        <p id="save-error" class="message" role="status" aria-live="polite"></p>
        <button id="save" class="primary" type="submit">
          保存并返回</button
        ><button id="remove" class="remove-key" type="button" hidden>
          移除密钥
        </button>
      </form>
    </dialog>
  </body>
</html>
