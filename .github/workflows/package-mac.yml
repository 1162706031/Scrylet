name: Build macOS packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run dist:mac -- --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Scrylet-mac-${{ matrix.arch }}
          path: |
            dist/releases/**
            build/mac-*/package-check.json
          if-no-files-found: error
